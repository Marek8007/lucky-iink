    placeholder_text = <i>Contraseña para desbloquear</i>
    fail_text = Inténtalo de nuevo
    fade_on_empty = false
    position = 0, -85
    halign = center
    valign = center
}
label {
    monitor =
    text = $TIME
    font_family = Classic Console
    font_size = 72
    color = rgba(171717ff)
    position = 0, 60
    halign = center
    valign = center
}
label {
    monitor =
    text = [ SESIÓN BLOQUEADA ]
    font_family = Classic Console
    font_size = 14
    color = rgba(884258ff)
