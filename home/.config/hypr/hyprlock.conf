# Paperbit · pantalla de bloqueo
background {
    monitor =
    color = rgba(ffffffff)
}
input-field {
    monitor =
    size = 320, 52
    outline_thickness = 2
    rounding = 0
    outer_color = rgba(171717ff)
    inner_color = rgba(ffffffff)
    font_color = rgba(171717ff)
    check_color = rgba(P171717ff)
